<!DOCTYPE html>
<html lang="en" data-palette="resume" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nexus — Central Hub{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/nexus.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function(){
      var PALETTES = ['tuxedo','meridian','alabaster','leadership','blueprint','resume',
                      'foundry','forge','frigid','bloom','prism','ember','oldglory','alchemist',
                      'coruscant','retro','jarvis','hal9000','neuromancer','deepspace','bladerunner','synthwave',
                      'espresso','terracotta','sage','blush'];
      try {
        var p = localStorage.getItem('nexus-palette');
        var m = localStorage.getItem('nexus-mode');
        var html = document.documentElement;
        if (p && PALETTES.indexOf(p) !== -1) html.setAttribute('data-palette', p);
        else html.setAttribute('data-palette', 'resume');
        if (m === 'light' || m === 'dark') html.setAttribute('data-mode', m);
        else html.setAttribute('data-mode', 'light');
      } catch(e) {}
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="nav-brand">
    <svg class="nav-logo" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="44" cy="44" r="10" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="2"/>
      <circle cx="44" cy="44" r="5"  fill="currentColor" opacity=".5"/>
      <line x1="44" y1="34" x2="44" y2="14"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="44" y1="54" x2="44" y2="74"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="34" y1="44" x2="14" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="54" y1="44" x2="74" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="37" y1="37" x2="22" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="51" y1="37" x2="66" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="51" y1="51" x2="66" y2="66"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <circle cx="44" cy="11" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="44" cy="77" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="11" cy="44" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="77" cy="44" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="19" cy="19" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="69" cy="19" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="69" cy="69" r="4" fill="currentColor" opacity=".75"/>
    </svg>
    <span class="nav-title">NEXUS</span>
    <span class="nav-sub">Central Hub</span>
  </a>

  <div class="nav-spacer"></div>

  <div class="nav-actions">
    <span class="nav-last-scan" id="lastScan">{% block last_scan %}{% endblock %}</span>
    <button class="nav-scan-btn" id="scanBtn" onclick="triggerScan()">Scan Now</button>

    <!-- Palette picker -->
    <div class="palette-picker" id="palettePicker" role="combobox" aria-expanded="false"
         aria-label="Select colour palette" tabindex="0">
      <span class="palette-picker-swatches" id="palettePickerSwatches"></span>
      <span class="palette-picker-label" id="palettePickerLabel">Resume</span>
      <span class="palette-picker-caret">&#9662;</span>
      <ul class="palette-picker-dropdown" id="palettePickerDropdown" role="listbox">
        <!-- populated by main.js -->
      </ul>
    </div>

    <!-- Hidden select for fallback -->
    <select id="paletteSelect" aria-hidden="true"
            style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">
      <option value="tuxedo">Tuxedo</option>
      <option value="meridian">Meridian</option>
      <option value="alabaster">Alabaster</option>
      <option value="leadership">Leadership</option>
      <option value="blueprint">Blueprint</option>
      <option value="resume">Resume</option>
      <option value="foundry">Foundry</option>
      <option value="forge">Forge</option>
      <option value="frigid">Frigid</option>
      <option value="bloom">Bloom</option>
      <option value="prism">Prism</option>
      <option value="ember">Ember</option>
      <option value="oldglory">Old Glory</option>
      <option value="alchemist">Alchemist</option>
      <option value="coruscant">Coruscant</option>
      <option value="retro">Retro</option>
      <option value="jarvis">JARVIS</option>
      <option value="hal9000">HAL-9000</option>
      <option value="neuromancer">Neuromancer</option>
      <option value="deepspace">Deep Space</option>
      <option value="bladerunner">Blade Runner</option>
      <option value="synthwave">Synthwave</option>
      <option value="espresso">Espresso</option>
      <option value="terracotta">Terracotta</option>
      <option value="sage">Sage</option>
      <option value="blush">Blush</option>
    </select>

    <!-- Dark/light toggle -->
    <label class="theme-switch" title="Toggle light/dark">
      <input type="checkbox" id="themeToggle">
      <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
    </label>
    <span id="modeLabel" class="theme-mode-label">Light</span>

    <a href="/logout" class="nav-logout">Logout</a>
  </div>
</nav>

<main class="page">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}

<!-- ── Session Timeout Warning ────────────────────────────────── -->
<style>
.session-timeout-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 10000;
  align-items: center; justify-content: center;
}
.session-timeout-overlay.active { display: flex; }
.session-timeout-card {
  background: var(--bg-panel, #1a1a24);
  border: 1px solid var(--border-accent, #c8a860);
  border-radius: 10px; padding: 2rem 2.25rem; max-width: 360px;
  width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.session-timeout-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: .75rem; color: var(--text-primary); }
.session-timeout-card p  { font-size: .88rem; color: var(--text-secondary); margin-bottom: .75rem; line-height: 1.5; }
.session-timeout-countdown {
  font-size: 1.75rem; font-weight: 700; font-family: monospace;
  color: var(--accent-primary); display: block; margin: .5rem 0 1.25rem;
}
.session-timeout-btns { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
.session-timeout-btns button {
  padding: .55rem 1.25rem; border-radius: 5px; border: none;
  cursor: pointer; font-size: .88rem; font-weight: 600; transition: opacity .15s;
}
.session-timeout-btns button:hover { opacity: .85; }
.session-timeout-logout   { background: var(--danger,       #8c3030); color: #fff; }
.session-timeout-continue { background: var(--accent-primary, #c8a860); color: #fff; }
</style>
<div class="session-timeout-overlay" id="sessionTimeoutOverlay">
  <div class="session-timeout-card">
    <h3>Session Expiring Soon</h3>
    <p>Your session will expire in</p>
    <span class="session-timeout-countdown" id="sessionTimeoutCountdown">5:00</span>
    <p>Click <strong>Continue Session</strong> to stay logged in,<br>or <strong>Logout</strong> to end now.</p>
    <div class="session-timeout-btns">
      <button class="session-timeout-logout"   onclick="sessionTimeoutLogout()">Logout</button>
      <button class="session-timeout-continue" onclick="sessionTimeoutContinue()">Continue Session</button>
    </div>
  </div>
</div>
<script>
(function () {
  var SESSION_MS  = 30 * 60 * 1000;
  var WARN_BEFORE =  5 * 60 * 1000;
  var _warnTimer, _expireTimer, _countdownInt;

  function _fmt(s) { return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }

  function _resetTimers() {
    clearTimeout(_warnTimer); clearTimeout(_expireTimer); clearInterval(_countdownInt);
    _warnTimer   = setTimeout(_showWarning, SESSION_MS - WARN_BEFORE);
    _expireTimer = setTimeout(function () { window.location.href = '/logout'; }, SESSION_MS);
  }

  function _showWarning() {
    var secs = Math.floor(WARN_BEFORE / 1000);
    var el = document.getElementById('sessionTimeoutCountdown');
    var ov = document.getElementById('sessionTimeoutOverlay');
    if (el) el.textContent = _fmt(secs);
    if (ov) ov.classList.add('active');
    _countdownInt = setInterval(function () {
      secs--;
      if (el) el.textContent = _fmt(Math.max(0, secs));
      if (secs <= 0) clearInterval(_countdownInt);
    }, 1000);
  }

  window.sessionTimeoutLogout = function () { window.location.href = '/logout'; };

  window.sessionTimeoutContinue = function () {
    fetch('/api/session_ping', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) {
        if (r.ok) {
          var ov = document.getElementById('sessionTimeoutOverlay');
          if (ov) ov.classList.remove('active');
          _resetTimers();
        } else {
          window.location.href = '/logout';
        }
      })
      .catch(function () { window.location.href = '/logout'; });
  };

  _resetTimers();
})();
</script>

</body>
</html>
