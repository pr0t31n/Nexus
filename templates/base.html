<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nexus — Central Hub{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/nexus.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function(){
      try {
        var m = localStorage.getItem('nexus-mode');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
      } catch(e) {}
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="nav-brand">
    <svg class="nav-logo" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="44" cy="44" r="10" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="2"/>
      <circle cx="44" cy="44" r="5"  fill="currentColor" opacity=".5"/>
      <line x1="44" y1="34" x2="44" y2="14"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="44" y1="54" x2="44" y2="74"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="34" y1="44" x2="14" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="54" y1="44" x2="74" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="37" y1="37" x2="22" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="51" y1="37" x2="66" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <line x1="51" y1="51" x2="66" y2="66"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
      <circle cx="44" cy="11" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="44" cy="77" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="11" cy="44" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="77" cy="44" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="19" cy="19" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="69" cy="19" r="4" fill="currentColor" opacity=".75"/>
      <circle cx="69" cy="69" r="4" fill="currentColor" opacity=".75"/>
    </svg>
    <span class="nav-title">NEXUS</span>
    <span class="nav-sub">Central Hub</span>
  </a>

  <div class="nav-spacer"></div>

  <div class="nav-actions">
    <span class="nav-last-scan" id="lastScan">{% block last_scan %}{% endblock %}</span>
    <button class="nav-scan-btn" id="scanBtn" onclick="triggerScan()">Scan Now</button>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">&#9788;</button>
    <a href="/logout" class="nav-logout">Logout</a>
  </div>
</nav>

<main class="page">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
