<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Nexus</title>
  <script>
    (function(){
      try {
        var m = localStorage.getItem('nexus-mode');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="44" cy="44" r="10" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="2"/>
        <circle cx="44" cy="44" r="5"  fill="currentColor" opacity=".5"/>
        <line x1="44" y1="34" x2="44" y2="14"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="44" y1="54" x2="44" y2="74"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="34" y1="44" x2="14" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="54" y1="44" x2="74" y2="44"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="37" y1="37" x2="22" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="51" y1="37" x2="66" y2="22"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <line x1="51" y1="51" x2="66" y2="66"  stroke="currentColor" stroke-width="1.5" opacity=".6"/>
        <circle cx="44" cy="11" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="44" cy="77" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="11" cy="44" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="77" cy="44" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="19" cy="19" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="69" cy="19" r="4" fill="currentColor" opacity=".75"/>
        <circle cx="69" cy="69" r="4" fill="currentColor" opacity=".75"/>
      </svg>
      <span class="auth-logo-title">NEXUS</span>
    </div>

    <p class="auth-heading">
      {% if force %}Default credentials must be replaced before continuing.
      Choose a unique username and a strong password.
      {% else %}Update your account password.{% endif %}
    </p>

    {% if error %}
    <div class="auth-alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/change-password" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if force %}
      <div class="auth-field">
        <label for="new_username">NEW USERNAME</label>
        <input type="text" id="new_username" name="new_username"
               autocomplete="username" required autofocus
               minlength="3" maxlength="32" spellcheck="false">
      </div>
      {% else %}
      <div class="auth-field">
        <label for="current_password">CURRENT PASSWORD</label>
        <input type="password" id="current_password" name="current_password"
               autocomplete="current-password" required autofocus>
      </div>
      {% endif %}
      <div class="auth-field">
        <label for="new_password">NEW PASSWORD</label>
        <input type="password" id="new_password" name="new_password"
               autocomplete="new-password" required minlength="8">
      </div>
      <div class="auth-field">
        <label for="confirm_password">CONFIRM NEW PASSWORD</label>
        <input type="password" id="confirm_password" name="confirm_password"
               autocomplete="new-password" required>
      </div>
      <button type="submit" class="auth-submit">
        {% if force %}SET CREDENTIALS{% else %}UPDATE PASSWORD{% endif %}
      </button>
    </form>
    {% if not force %}<p class="auth-hint"><a href="/">Cancel</a></p>{% endif %}
  </div>
</div>
</body>
</html>
