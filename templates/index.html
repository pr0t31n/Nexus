{% extends "base.html" %}
{% block title %}Nexus — Central Hub{% endblock %}
{% block last_scan %}Last scan: {{ last_scan }}{% endblock %}

{% block head %}
<script>
  window._initialInstances = {{ instances | tojson }};
</script>
{% endblock %}

{% block content %}
<div class="section-header">
  <span class="section-title">Discovered Instances</span>
  <span class="section-count" id="instanceCount">{{ instances|length }}</span>
</div>

<div class="search-wrap">
  <input id="searchInput" class="search-input" type="search"
         placeholder="Filter by name or host…" autocomplete="off">
  <div class="search-suggestions" id="searchSuggestions"></div>
</div>

<div class="instance-grid" id="instanceGrid"></div>
{% endblock %}
